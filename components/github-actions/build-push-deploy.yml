# Build, Push & Deploy
#
# Derived from HiveMind. Two jobs:
#   Build & push: builds the backend and frontend images and pushes them to GHCR,
#                 tagged with the commit SHA and latest
#   Deploy:       fetches docker-compose.prod.yml at that commit on the VPS, pulls the
#                 SHA-tagged images, runs migrations, restarts the stack
#
# Prod config lives on the VPS in ${DEPLOY_PATH}/shared/env (app.env + secrets.env,
# read through env_file in docker-compose.prod.yml), never in this workflow.
#
# Required secrets: DEPLOY_SSH_HOST, DEPLOY_SSH_USER, DEPLOY_SSH_PRIVATE_KEY
# (plus any build-time frontend variable, e.g. VITE_API_BASE_URL).
#
# Template variables to substitute before use:
#   ${BACKEND_DOCKERFILE}    e.g. "apps/api/Dockerfile" or "backend/Dockerfile"
#   ${FRONTEND_DOCKERFILE}   e.g. "apps/web/Dockerfile" or "frontend/Dockerfile"
#   ${DEPLOY_PATH}           project root on the VPS, e.g. "/home/<user>/<domain>/<project>"
#   ${DB_USER}               Postgres user checked by pg_isready
#   ${MIGRATIONS_CMD}        run in a one-off backend container:
#                              Fastify + Prisma: node_modules/.bin/prisma migrate deploy
#                              FastAPI + Alembic: alembic upgrade head
#                              Laravel:          php artisan migrate --force
#
# Gate: runs after the "E2E" workflow succeeds on main; use "CI" if there is no E2E.

name: Build, Push & Deploy

on:
  # Triggered after E2E suite passes on main
  workflow_run:
    workflows: ["E2E"]
    types: [completed]
    branches: [main]
  # Manual trigger for hotfixes (bypasses E2E gate)
  workflow_dispatch:

jobs:
  # Job 1: build the Docker images (backend, frontend) and push them to GHCR. Build and
  # push are one build-push-action step (push: true): a separate push job would
  # have to move the images between runners.
  build-and-push:
    name: Build & push
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')

    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      repo: ${{ steps.sha.outputs.repo }}

    steps:
      # ── Resolve the exact commit SHA and lowercase repo name ────────────────
      - name: Resolve SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sha.outputs.sha }}

      # ── Authenticate with GHCR ───────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build and push images ────────────────────────────────────────────────
      - name: Build & push backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${BACKEND_DOCKERFILE}
          target: production
          push: true
          tags: |
            ghcr.io/${{ steps.sha.outputs.repo }}/backend:latest
            ghcr.io/${{ steps.sha.outputs.repo }}/backend:${{ steps.sha.outputs.sha }}

      - name: Build & push frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${FRONTEND_DOCKERFILE}
          target: production
          push: true
          # Build-time frontend variables, if any (Vite inlines them in the bundle)
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          tags: |
            ghcr.io/${{ steps.sha.outputs.repo }}/frontend:latest
            ghcr.io/${{ steps.sha.outputs.repo }}/frontend:${{ steps.sha.outputs.sha }}

  # Job 2: deploy the images pushed by job 1 to the VPS over SSH
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read

    steps:
      # ── Deploy to VPS ────────────────────────────────────────────────────────
      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ needs.build-and-push.outputs.sha }}
          REPO: ${{ needs.build-and-push.outputs.repo }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script_stop: true
          envs: GHCR_TOKEN,ACTOR,SHA,REPO
          script: |
            set -Eeuo pipefail

            echo "==> Ensure deploy directories exist"
            mkdir -p ${DEPLOY_PATH}/compose ${DEPLOY_PATH}/shared/env

            echo "==> Fetch docker-compose.prod.yml (commit: ${SHA})"
            curl -fsSL \
              "https://raw.githubusercontent.com/${REPO}/${SHA}/docker-compose.prod.yml" \
              -o ${DEPLOY_PATH}/compose/docker-compose.prod.yml

            cd ${DEPLOY_PATH}/compose

            # pin the images pushed above for this commit, instead of the compose default (latest)
            export IMAGE_TAG="${SHA}"

            echo "==> Authenticate with GHCR"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

            echo "==> Pull new images"
            docker compose -f docker-compose.prod.yml pull

            echo "==> Start database"
            docker compose -f docker-compose.prod.yml up -d db

            echo "==> Wait for database to be healthy"
            timeout 60 sh -c 'until docker compose -f docker-compose.prod.yml exec -T db pg_isready -U ${DB_USER}; do sleep 2; done'

            echo "==> Run pending migrations"
            docker compose -f docker-compose.prod.yml run --rm --no-deps backend \
              ${MIGRATIONS_CMD}

            echo "==> Start all services"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "==> Stack status"
            docker compose -f docker-compose.prod.yml ps
