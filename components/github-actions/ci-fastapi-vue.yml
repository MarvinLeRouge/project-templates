# CI - FastAPI + Vue (uv backend at the repo root, npm frontend in frontend/)
#
# Derived from Stamped. Required status check on main: "CI status".
# Coverage gate (85% minimum per part): Codecov project status, see components/codecov.
#
# Template variables to substitute before use:
#   ${PYTHON_PACKAGE}   backend package measured by coverage, e.g. "stamped"
#                       (the source lives in backend/${PYTHON_PACKAGE})
#
# Adapt the `changes` filters to the real layout (e.g. drop migrations/** without Alembic).
# Docs-only PRs still run this workflow (no path filter on pull_request): skipped jobs
# count as passing in ci-status, which is the single required check of the ruleset.

name: CI

on:
  # Dispatched by changelog.yml on its bot PR: events created with GITHUB_TOKEN do not
  # trigger pull_request runs, but workflow_dispatch is exempt from that rule
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - "**.md"
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'migrations/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  # ── Python ────────────────────────────────────────────────────────────────

  backend-lint:
    name: "Backend: lint"
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check backend/

      - name: Ruff format
        run: uv run ruff format --check backend/

      - name: Mypy
        run: uv run mypy backend/

  backend-test:
    name: "Backend: test"
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        run: uv run pytest backend/tests/ --cov=backend/${PYTHON_PACKAGE} --cov-report=xml -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage.xml
          flags: backend
          fail_ci_if_error: false

  backend-security:
    name: "Backend: security"
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: pip-audit (dependency vulnerability scan)
        run: uv export --format requirements-txt --no-hashes --no-emit-project > /tmp/req.txt && uvx pip-audit -r /tmp/req.txt

  # ── Node / Vue ────────────────────────────────────────────────────────────

  frontend-lint:
    name: "Frontend: lint"
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run type-check

  frontend-test:
    name: "Frontend: test"
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests with coverage
        working-directory: frontend
        run: npm run test:unit -- --coverage --run

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  frontend-security:
    name: "Frontend: security"
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: npm audit (dependency vulnerability scan)
        working-directory: frontend
        run: npm audit --audit-level=critical

  ci-status:
    name: CI status
    if: always()
    needs: [changes, backend-lint, backend-test, backend-security, frontend-lint, frontend-test, frontend-security]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
