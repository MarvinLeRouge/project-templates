# pre-commit hooks - Python backend (Ruff + mypy), uv project at the repo root
#
# Append these repos to the ones of base.yml (gitleaks first, changelog).
#
# Template variables to substitute before use (see stacks/ README for values):
#   ${RUFF_REV}      ruff-pre-commit revision matching the ruff in uv.lock, e.g. "v0.17.4"
#   ${BACKEND_DIR}   backend directory name, e.g. "backend" (use "." for a flat project)

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ${RUFF_REV}
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^${BACKEND_DIR}/
      - id: ruff-format
        files: ^${BACKEND_DIR}/

  - repo: local
    hooks:
      # Same command as the CI lint job; mypy config in pyproject.toml
      - id: mypy
        name: mypy (backend)
        entry: uv run mypy ${BACKEND_DIR}/
        language: system
        types: [python]
        pass_filenames: false
